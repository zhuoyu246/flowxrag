apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels: { app: gateway }
spec:
  selector: { app: gateway }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata:
  name: rag-service
  labels: { app: rag-service }
spec:
  selector: { app: rag-service }
  ports:
    - { name: http, port: 8000, targetPort: http }
    - { name: grpc, port: 50051, targetPort: grpc }
    - { name: metrics, port: 9090, targetPort: metrics }
---
apiVersion: v1
kind: Service
metadata:
  name: sync-service
  labels: { app: sync-service }
spec:
  selector: { app: sync-service }
  ports: [{ name: http, port: 8081, targetPort: http }]
