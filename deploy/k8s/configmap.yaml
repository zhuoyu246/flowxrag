apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-config
data:
  VECTOR_STORE: faiss
  RAG_GRPC_ADDR: rag-service:50051
  RAG_HTTP_URL: http://rag-service:8000
  REDIS_URL: redis://redis:6379/0
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_DOCUMENT_TOPIC: rag-document-change
  KAFKA_DOCUMENT_DLQ_TOPIC: rag-document-dlq
  KAFKA_GROUP_ID: rag-sync-service
  RATE_LIMIT: "100"
  OTEL_ENABLED: "true"
  OTEL_EXPORTER: otlp
  OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
  CRAG_DATA_DIR: /app/data
  GATEWAY_TIMEOUT_SECONDS: "65"
  DOCUMENT_LOCK_TTL_SECONDS: "300"
