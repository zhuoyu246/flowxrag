apiVersion: v1
kind: ConfigMap
metadata: { name: otel-collector-config }
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: {}
    processors: { batch: {} }
    exporters:
      otlp/jaeger: { endpoint: jaeger-collector:4317, tls: { insecure: true } }
      prometheus: { endpoint: 0.0.0.0:8889 }
    service:
      pipelines:
        traces: { receivers: [otlp], processors: [batch], exporters: [otlp/jaeger] }
        metrics: { receivers: [otlp], processors: [batch], exporters: [prometheus] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: otel-collector }
spec:
  replicas: 1
  selector: { matchLabels: { app: otel-collector } }
  template:
    metadata: { labels: { app: otel-collector } }
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.139.0
          args: ["--config=/etc/otel/otel-collector-config.yaml"]
          ports: [{ name: otlp, containerPort: 4317 }, { name: metrics, containerPort: 8889 }]
          volumeMounts: [{ name: config, mountPath: /etc/otel }]
      volumes: [{ name: config, configMap: { name: otel-collector-config } }]
---
apiVersion: v1
kind: Service
metadata: { name: otel-collector }
spec:
  selector: { app: otel-collector }
  ports:
    - { name: otlp, port: 4317, targetPort: otlp }
    - { name: metrics, port: 8889, targetPort: metrics }
