apiVersion: v1
kind: ConfigMap
metadata: { name: prometheus-config }
data:
  prometheus.yml: |
    global: { scrape_interval: 15s }
    rule_files: [/etc/prometheus/rules/metric-rules.yml]
    scrape_configs:
      - job_name: gateway
        static_configs: [{ targets: [gateway:8080] }]
      - job_name: sync-service
        static_configs: [{ targets: [sync-service:8081] }]
      - job_name: rag-service
        static_configs: [{ targets: [rag-service:9090] }]
      - job_name: otel-collector
        static_configs: [{ targets: [otel-collector:8889] }]
  metric-rules.yml: |
    groups:
      - name: rag-alerts
        rules:
          - alert: KafkaLagGrowing
            expr: kafka_consumer_lag > 1000
            for: 10m
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: prometheus }
spec:
  replicas: 1
  selector: { matchLabels: { app: prometheus } }
  template:
    metadata: { labels: { app: prometheus } }
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.6.0
          args: ["--config.file=/etc/prometheus/prometheus.yml"]
          ports: [{ name: http, containerPort: 9090 }]
          volumeMounts: [{ name: config, mountPath: /etc/prometheus }]
      volumes: [{ name: config, configMap: { name: prometheus-config } }]
---
apiVersion: v1
kind: Service
metadata: { name: prometheus }
spec:
  selector: { app: prometheus }
  ports: [{ name: http, port: 9090, targetPort: http }]
