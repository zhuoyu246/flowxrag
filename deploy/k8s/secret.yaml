# Replace these placeholders through kubectl/External Secrets; do not commit a
# real secret. stringData is used so kubectl performs the base64 conversion.
apiVersion: v1
kind: Secret
metadata:
  name: rag-secrets
type: Opaque
stringData:
  JWT_SECRET_KEY: CHANGE_ME
  OPENAI_API_KEY: CHANGE_ME
  EMBEDDING_API_KEY: CHANGE_ME
  TAVILY_API_KEY: CHANGE_ME
  DATABASE_URL: postgresql+asyncpg://crag:CHANGE_ME@postgres:5432/crag
