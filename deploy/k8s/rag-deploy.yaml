apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rag-data
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 10Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-service
  labels: { app: rag-service }
spec:
  replicas: 1 # FAISS uses a local on-disk index; scale only with a shared-index design.
  strategy: { type: RollingUpdate }
  selector: { matchLabels: { app: rag-service } }
  template:
    metadata:
      labels: { app: rag-service }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "9090", prometheus.io/path: /metrics }
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: rag-service
          image: harbor.example.com/rag/rag-service:REPLACE_WITH_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8000 }
            - { name: grpc, containerPort: 50051 }
            - { name: metrics, containerPort: 9090 }
          envFrom:
            - { configMapRef: { name: rag-config } }
            - { secretRef: { name: rag-secrets } }
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: "2", memory: 4Gi }
          volumeMounts: [{ name: rag-data, mountPath: /app/data }]
          startupProbe: { httpGet: { path: /health, port: http }, failureThreshold: 45, periodSeconds: 2 }
          readinessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 30, periodSeconds: 15 }
      volumes: [{ name: rag-data, persistentVolumeClaim: { claimName: rag-data } }]
