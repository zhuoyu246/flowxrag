canal.instance.gtidon = false
canal.instance.master.address = mysql:3306
canal.instance.master.journal.name =
canal.instance.master.position =
canal.instance.master.timestamp =
canal.instance.master.gtid =
canal.instance.mysql.slaveId = 12345
canal.instance.tsdb.enable = true
canal.instance.dbUsername = canal
canal.instance.dbPassword = canal-local-only
canal.instance.connectionCharset = UTF-8
canal.instance.enableDruid = false

# Only the index-outbox table is captured; DDL and unrelated database changes
# never enter the document Kafka topic.
canal.instance.filter.regex = rag_cdc\\.document_records
canal.instance.filter.query.ddl = false
canal.mq.topic = rag-document-change
canal.mq.partition = 0
canal.mq.partitionsNum = 1
canal.mq.partitionHash = rag_cdc.document_records:id
