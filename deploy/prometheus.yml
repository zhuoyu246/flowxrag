global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files: []

scrape_configs:
  # CRAG 后端 FastAPI 指标
  - job_name: "crag_backend"
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: /metrics
    scrape_interval: 15s

  # Celery Worker 指标（via Flower）
  - job_name: "celery_flower"
    static_configs:
      - targets: ["flower:5555"]
    metrics_path: /metrics
    scrape_interval: 30s

  # Redis 指标（redis_exporter）
  - job_name: "redis"
    static_configs:
      - targets: ["redis_exporter:9121"]

  # PostgreSQL 指标（postgres_exporter）
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres_exporter:9187"]

  # Prometheus 自身
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
