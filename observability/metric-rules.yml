groups:
  - name: rag-alerts
    rules:
      - alert: RAGHighErrorRate
        expr: sum(rate(rag_requests_total{status="error"}[5m])) / clamp_min(sum(rate(rag_requests_total[5m])), 1) > 0.05
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "RAG error rate exceeds 5%" }
      - alert: KafkaLagGrowing
        expr: kafka_consumer_lag > 1000
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "RAG sync Kafka lag exceeds 1000" }
