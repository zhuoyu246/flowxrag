# Alembic 数据库迁移工具配置
# 使用方式：
#   alembic revision --autogenerate -m "描述"  # 生成迁移脚本
#   alembic upgrade head                        # 执行迁移
#   alembic downgrade -1                        # 回滚一步

[alembic]
script_location = alembic
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .
# 注意：真实 URL 从环境变量读取，此处为占位
sqlalchemy.url = postgresql://crag:cragpassword@localhost/crag

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
